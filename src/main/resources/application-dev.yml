# ============================================================
# 开发环境：连接本机原生安装的 MySQL / Redis / Kafka
# 详见 README「本机中间件」；MySQL 8.0.29 -> localhost:3306，root / 123456
# ============================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本机 MySQL 8.0.29 直接用 3306（不再是 Docker 映射的 3307）
    url: jdbc:mysql://localhost:3306/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: 123456
    hikari:
      # ★ r2-pool：从 r0 的 10/30s 调到 30/3s
      #   连接不是越多越好：本机 10 核 + 2 磁盘，HikariCP 经验上限 ≈ 核*2+磁盘 ≈ 22
      #   梯度实验（10/20/30/50）见 docs/lab/r2-pool.md
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 3000
      pool-name: SeckillHikariPool

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      # password:
      timeout: 3000ms

  kafka:
    bootstrap-servers: localhost:9092
    # v3-consistency：手动 ack（消费者处理成功才确认）
    listener:
      ack-mode: manual
    producer:
      acks: all
      retries: 3
      # Kafka 不可用时尽快失败（否则发送会挂很久才报错）
      properties:
        max.block.ms: 3000
        delivery.timeout.ms: 5000
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Jackson 3 版本序列化器（Boot 4 默认 Jackson 3，不要用 JsonSerializer）
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: seckill-lab
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        # 反序列化时允许的包（按需调整）
        spring.json.trusted.packages: com.lsy.seckill.*

mybatis-plus:
  configuration:
    # 开发环境打印 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
