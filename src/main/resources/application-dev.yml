# ============================================================
# 开发环境：依赖 docker-compose.yml 启动的 MySQL / Redis / Kafka
# ============================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      pool-name: SeckillHikariPool

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      # password:
      timeout: 3000ms

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Jackson 3 版本序列化器（Boot 4 默认 Jackson 3，不要用 JsonSerializer）
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: seckill-lab
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        # 反序列化时允许的包（按需调整）
        spring.json.trusted.packages: com.lsy.seckill.*

mybatis-plus:
  configuration:
    # 开发环境打印 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
