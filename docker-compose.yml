# 秒杀实验环境：MySQL + Redis + Kafka（单机）
# 启动：docker compose up -d
# 停止：docker compose down
# 注意：MySQL 初始化脚本仅在数据卷为空（首次启动）时执行；
#       如需重跑脚本，先执行 docker compose down -v 清空数据卷。

services:
  mysql:
    image: mysql:8.4
    container_name: seckill-mysql
    ports:
      # 宿主机 3307 -> 容器 3306（避开本机已安装的 MySQL 8.0 占用的 3306）
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seckill
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: seckill-redis
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:4.3.1
    container_name: seckill-kafka
    ports:
      - "9092:9092"
    environment:
      # 限制 JVM 堆：Kafka 默认堆约 1G，是 Docker 内最大内存消耗者。
      # 单机实验环境 512M 足够；生产环境请按吞吐量调整。
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      # 单节点 KRaft 模式（Kafka 4.x 已移除 ZooKeeper）
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  mysql-data:
  redis-data:
  kafka-data:
